---
layout: default
title: 対談字起こしツール
---

<main>
<header class="sp-gen__head">
  <h1>字起こしタグツール（複数人対談・他己紹介対応）</h1>
  <p class="sp-gen__desc">対談人数を設定し、メンバー情報、リード文、質問・全員の回答を入力すると、リアルタイムでHTMLコードが生成されます。</p>
</header>

<section class="sp-gen" aria-label="字起こしタグツール">
  <div class="sp-gen__wrap">
    <div class="sp-gen__body">
      <!-- 左側：入力エリア -->
      <div class="sp-gen__grid">
        
        <!-- リード文入力 -->
        <div class="sp-gen__row">
          <div class="sp-gen__label">◆ リード文（&lt;p&gt;&lt;strong&gt;で囲まれます）</div>
          <textarea class="sp-gen__textarea" id="id_lead" style="min-height: 70px;" placeholder="例：今回は◯◯選手、△△選手にお話を伺いました。"></textarea>
        </div>

        <!-- 取材日入力 -->
        <div class="sp-gen__row">
          <div class="sp-gen__label">◆ 取材日</div>
          <input class="sp-gen__input" id="id_date" placeholder="例：９月１日">
        </div>

        <!-- 取材形式選択（対面 or オンライン） -->
        <div class="sp-gen__row">
          <div class="sp-gen__label">◆ 取材形式</div>
          <div class="sp-gen__radio-group" style="display: flex; gap: 16px; margin-top: 4px;">
            <label class="sp-gen__radio-label" style="display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 14px;">
              <input type="radio" name="interview_style" value="対面" checked style="cursor: pointer;"> 対面
            </label>
            <label class="sp-gen__radio-label" style="display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 14px;">
              <input type="radio" name="interview_style" value="オンライン" style="cursor: pointer;"> オンライン
            </label>
          </div>
        </div>

        <hr style="border: 0; border-top: 1px dashed rgba(0,0,0,.1); margin: 5px 0;">

        <!-- 1. 対談人数の指定 -->
        <div class="sp-gen__row" style="background: #eef7ff; padding: 10px; border-radius: 6px; border: 1px solid #b3d7ff;">
          <div class="sp-gen__label" style="color: #004085; font-weight: bold;">◆ 対談人数を設定</div>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
            <input type="number" class="sp-gen__input" id="id_member_count" min="1" max="10" value="3" style="width: 80px;">
            <span>人</span>
          </div>
        </div>

        <!-- 2. 対談メンバーのプロフィール入力欄（動的生成） -->
        <div id="member_container" style="display: flex; flex-direction: column; gap: 10px;"></div>

        <hr style="border: 0; border-top: 1px dashed rgba(0,0,0,.1); margin: 5px 0;">

        <!-- 3. 項目（見出し / 質問・各人回答）の動的コンテナ -->
        <div id="item_container" style="display: flex; flex-direction: column; gap: 14px;"></div>

        <!-- 項目の追加・削除操作ボタン -->
        <div class="sp-gen__actions" style="margin-top: 5px;">
          <button class="sp-gen__btn sp-gen__btn--ghost" id="btn_add_qa" type="button" style="border-color: #0066cc; color: #0066cc;">＋ 質問を追加</button>
          <button class="sp-gen__btn sp-gen__btn--ghost" id="btn_add_h3" type="button" style="border-color: #2e7d32; color: #2e7d32;">＋ 見出し(h3)を追加</button>
          <button class="sp-gen__btn sp-gen__btn--ghost" id="btn_remove_item" type="button" style="border-color: #cc0000; color: #cc0000;">－ 最後の項目を削除</button>
        </div>

        <div class="sp-gen__actions" style="margin-top: 15px;">
          <button class="sp-gen__btn" id="btn_gen" type="button">コード生成</button>
          <button class="sp-gen__btn sp-gen__btn--ghost" id="btn_clear" type="button">クリア</button>
        </div>
      </div>

      <!-- 右側：出力エリア -->
      <div class="sp-gen__out-area">
        <div class="sp-gen__outlabel">
          <div class="sp-gen__label" style="color: #0066cc;">【出力コード】</div>
          <p class="sp-gen__status" id="status">未生成</p>
        </div>

        <textarea class="sp-gen__textarea" id="out" placeholder="ここに生成されたHTMLコードが出力されます" readonly style="min-height: 200px;"></textarea>

        <div class="sp-gen__actions">
          <button class="sp-gen__btn" id="btn_copy" type="button">コードをコピー</button>
          <button class="sp-gen__btn sp-gen__btn--ghost" id="btn_select" type="button">全選択</button>
        </div>

        <div class="sp-preview" style="margin-top: 15px;">
          <p class="sp-preview__label" style="color: #2e7d32; font-weight: bold; margin-bottom: 6px;">【簡易プレビュー】</p>
          <div class="sp-preview__box" id="preview" style="background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var itemCount = 0; // 全項目のカウント
      var qCount = 0;    // 質問のナンバリング用

      function esc(s){
        return String(s ?? "")
          .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
          .replaceAll('"',"&quot;").replaceAll("'","&#39;");
      }
      
      function v(id){ 
        var el = document.getElementById(id);
        return el ? el.value.trim() : ""; 
      }

      function getRadioValue(name) {
        var el = document.querySelector('input[name="' + name + '"]:checked');
        return el ? el.value : "対面";
      }

      function formatAnswer(text) {
        return esc(text).replace(/\r\n|\r|\n/g, '<br>');
      }

      // --- メンバー（名前・メモ）入力エリアの再構築 ---
      function rebuildMemberInputs() {
        var countInput = document.getElementById("id_member_count");
        var count = parseInt(countInput ? countInput.value : 1, 10) || 1;
        if (count < 1) count = 1;
        if (count > 10) count = 10;

        var container = document.getElementById("member_container");
        if (!container) return;

        // 現時点の値をバックアップ
        var oldData = [];
        var oldRows = container.querySelectorAll(".member-row");
        oldRows.forEach(function(row, idx) {
          var nameEl = row.querySelector(".input-member-name");
          var memoEl = row.querySelector(".input-member-memo");
          oldData.push({
            name: nameEl ? nameEl.value : "",
            memo: memoEl ? memoEl.value : ""
          });
        });

        // デフォルト初期値（初回）
        var defaultNames = ["北嶋", "井上", "成瀬"];

        container.innerHTML = "";

        for (var i = 0; i < count; i++) {
          var rowDiv = document.createElement("div");
          rowDiv.className = "sp-gen__row member-row";
          rowDiv.style.background = "#fafafa";
          rowDiv.style.padding = "10px";
          rowDiv.style.borderRadius = "6px";
          rowDiv.style.border = "1px solid #eee";

          var valName = oldData[i] ? oldData[i].name : (defaultNames[i] || ("メンバー" + (i + 1)));
          var valMemo = oldData[i] ? oldData[i].memo : "";

          rowDiv.innerHTML = 
            '<div class="sp-gen__label" style="font-weight:bold; color:#333;">◆ メンバー ' + (i + 1) + '</div>' +
            '<input class="sp-gen__input input-member-name" id="id_member_name_' + i + '" placeholder="例：北嶋" value="' + esc(valName) + '" style="margin-bottom:4px;">' +
            '<textarea class="sp-gen__textarea input-member-memo" id="id_member_memo_' + i + '" style="min-height: 60px;" placeholder="プロフィール・メモ（末尾に出力される場合に使用）">' + esc(valMemo) + '</textarea>';

          container.appendChild(rowDiv);

          var nameEl = document.getElementById("id_member_name_" + i);
          var memoEl = document.getElementById("id_member_memo_" + i);
          if (nameEl) nameEl.addEventListener("input", function() { refreshMemberLabels(); build(); });
          if (memoEl) memoEl.addEventListener("input", build);
        }

        // 既存の質問項目の回答者ラベルも更新
        refreshMemberLabels();
      }

      // 質問内の「各回答者のラベル」を入力された名前と動的に連動させる
      function refreshMemberLabels() {
        var memberInputs = document.querySelectorAll(".input-member-name");
        var container = document.getElementById("item_container");
        if (!container) return;

        var qaRows = container.querySelectorAll(".item-qa");
        qaRows.forEach(function(qaRow) {
          var answersBox = qaRow.querySelector(".answers-box");
          if (!answersBox) return;

          var aRows = answersBox.querySelectorAll(".single-answer-row");
          memberInputs.forEach(function(mInput, idx) {
            var mName = mInput.value.trim() || ("メンバー" + (idx + 1));
            
            if (aRows[idx]) {
              var label = aRows[idx].querySelector(".ans-member-label");
              if (label) label.textContent = mName + " の回答";
            } else {
              // 人数が増えた場合は回答欄を新しく追加
              var newARow = document.createElement("div");
              newARow.className = "single-answer-row";
              newARow.style.marginTop = "6px";
              newARow.innerHTML = 
                '<div class="sp-gen__label ans-member-label" style="font-size:12px; color:#555;">' + esc(mName) + ' の回答</div>' +
                '<textarea class="sp-gen__textarea input-a" data-member-index="' + idx + '" style="min-height: 60px;" placeholder="回答文を入力"></textarea>';
              answersBox.appendChild(newARow);
              
              var newAEl = newARow.querySelector(".input-a");
              if (newAEl) newAEl.addEventListener("input", build);
            }
          });

          // 人数が減った場合は余分な回答欄を削除
          while (aRows.length > memberInputs.length) {
            var lastIndex = aRows.length - 1;
            aRows[lastIndex].remove();
            aRows = answersBox.querySelectorAll(".single-answer-row");
          }
        });
      }

      // 質問・全員の回答セットを追加
      function addQARow(qVal) {
        itemCount++;
        qCount++;
        var container = document.getElementById("item_container");
        if (!container) return;

        var rowDiv = document.createElement("div");
        rowDiv.className = "sp-gen__row item-row item-qa";
        rowDiv.id = "item_row_" + itemCount;
        rowDiv.setAttribute("data-type", "qa");

        var html = '<div class="sp-gen__label" style="color: #0066cc; font-weight:bold;">質問 ' + qCount + '</div>' +
                   '<input class="sp-gen__input input-q" id="id_q_' + itemCount + '" placeholder="例：まずは他己紹介をお願いします" value="' + esc(qVal || "") + '">' +
                   '<div class="answers-box" style="margin-top: 8px; padding-left: 10px; border-left: 3px solid #0066cc;">';

        var memberInputs = document.querySelectorAll(".input-member-name");
        memberInputs.forEach(function(mInput, idx) {
          var mName = mInput.value.trim() || ("メンバー" + (idx + 1));
          html += '<div class="single-answer-row" style="margin-top: 6px;">' +
                  '  <div class="sp-gen__label ans-member-label" style="font-size:12px; color:#555;">' + esc(mName) + ' の回答</div>' +
                  '  <textarea class="sp-gen__textarea input-a" data-member-index="' + idx + '" style="min-height: 60px;" placeholder="回答文を入力"></textarea>' +
                  '</div>';
        });

        html += '</div>';
        rowDiv.innerHTML = html;
        container.appendChild(rowDiv);

        var qEl = document.getElementById("id_q_" + itemCount);
        if (qEl) qEl.addEventListener("input", build);

        var aEls = rowDiv.querySelectorAll(".input-a");
        aEls.forEach(function(aEl) {
          aEl.addEventListener("input", build);
        });
      }

      // 見出し(h3)を追加
      function addH3Row(h3Val) {
        itemCount++;
        var container = document.getElementById("item_container");
        if (!container) return;

        var rowDiv = document.createElement("div");
        rowDiv.className = "sp-gen__row item-row item-h3";
        rowDiv.id = "item_row_" + itemCount;
        rowDiv.setAttribute("data-type", "h3");
        rowDiv.style.background = "#f4f9f4";
        rowDiv.style.padding = "10px";
        rowDiv.style.borderRadius = "6px";
        rowDiv.style.border = "1px solid #c8e6c9";

        rowDiv.innerHTML = 
          '<div class="sp-gen__label" style="color: #2e7d32; font-weight:bold;">見出し (h3)</div>' +
          '<input class="sp-gen__input input-h3" id="id_h3_' + itemCount + '" placeholder="見出しテキストを入力" value="' + esc(h3Val || "") + '">';

        container.appendChild(rowDiv);

        var h3El = document.getElementById("id_h3_" + itemCount);
        if (h3El) h3El.addEventListener("input", build);
      }

      // 最後の項目（質問または見出し）を削除
      function removeItemRow() {
        if (itemCount <= 1) return;
        var row = document.getElementById("item_row_" + itemCount);
        if (row) {
          if (row.getAttribute("data-type") === "qa") {
            qCount--;
          }
          row.remove();
          itemCount--;
          build();
        }
      }

      // HTML出力コード生成のメイン処理
      function build(){
        var leadText = v("id_lead");
        var dateText = v("id_date");
        var styleText = getRadioValue("interview_style");
        var htmlParts = [];

        // 1. リード文
        if (leadText) {
          htmlParts.push('<p><strong>' + formatAnswer(leadText) + '</strong></p>');
        }

        // 2. 取材日・形式注記
        if (dateText) {
          htmlParts.push('<p>※この取材は' + esc(dateText) + 'に' + esc(styleText) + 'で行われました</p>');
        }

        // 3. 質問・回答・見出しエリアの走査
        var container = document.getElementById("item_container");
        if (container) {
          var rows = container.getElementsByClassName("item-row");
          
          // 最後に存在する有効な質問（qa）のインデックスを特定
          var lastQaIndex = -1;
          for (var k = rows.length - 1; k >= 0; k--) {
            if (rows[k].getAttribute("data-type") === "qa") {
              var qVal = rows[k].querySelector(".input-q").value.trim();
              if (qVal) {
                lastQaIndex = k;
                break;
              }
            }
          }

          var memberNames = [];
          document.querySelectorAll(".input-member-name").forEach(function(mInput, idx) {
            memberNames.push(mInput.value.trim() || ("メンバー" + (idx + 1)));
          });

          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var type = row.getAttribute("data-type");

            if (type === "h3") {
              var h3Input = row.querySelector(".input-h3");
              var h3Text = h3Input ? h3Input.value.trim() : "";
              if (h3Text) {
                htmlParts.push('<h3>' + esc(h3Text) + '</h3>');
              }
            } else if (type === "qa") {
              var qInput = row.querySelector(".input-q");
              var qText = qInput ? qInput.value.trim() : "";

              if (qText) {
                var qaLines = ['――' + esc(qText)];

                var aInputs = row.querySelectorAll(".input-a");
                aInputs.forEach(function(aInput) {
                  var aText = aInput.value.trim();
                  var mIdx = parseInt(aInput.getAttribute("data-member-index"), 10);
                  var speakerName = memberNames[mIdx] || "";

                  if (aText) {
                    qaLines.push(esc(speakerName) + ' ' + formatAnswer(aText));
                  }
                });

                // 最後の質問の場合のみ「――ありがとうございました！」を付与
                if (i === lastQaIndex) {
                  var lastLineIndex = qaLines.length - 1;
                  qaLines[lastLineIndex] += '<br>――ありがとうございました！';
                }

                htmlParts.push('<p>' + qaLines.join('<br>\n') + '</p>');
              }
            }
          }
        }

        // 4. メンバープロフィール（記入がある場合のみ出力）
        var profHtmlParts = [];
        var memberInputs = document.querySelectorAll(".member-row");
        memberInputs.forEach(function(mRow) {
          var nameVal = mRow.querySelector(".input-member-name").value.trim();
          var memoVal = mRow.querySelector(".input-member-memo").value.trim();
          
          if (nameVal || memoVal) {
            var singleProf = "";
            if (nameVal) singleProf += '<strong>◆' + esc(nameVal) + '</strong>';
            if (nameVal && memoVal) singleProf += '<br>';
            if (memoVal) singleProf += formatAnswer(memoVal);
            profHtmlParts.push(singleProf);
          }
        });

        if (profHtmlParts.length > 0) {
          htmlParts.push('<p class="wp-block-paragraph">\n' + profHtmlParts.join('<br><br>\n') + '\n</p>');
        }

        var fullHtml = htmlParts.join('\n\n');

        var outEl = document.getElementById("out");
        var previewEl = document.getElementById("preview");
        var statusEl = document.getElementById("status");

        if (outEl) outEl.value = fullHtml;
        if (previewEl) previewEl.innerHTML = fullHtml;
        if (statusEl) statusEl.textContent = fullHtml ? "生成OK" : "未生成";
      }

      function setupDefaultItems() {
        var container = document.getElementById("item_container");
        if (container) container.innerHTML = "";
        itemCount = 0;
        qCount = 0;

        rebuildMemberInputs();

        addH3Row(); // 見出し1
        addQARow("まずは他己紹介をお願いします"); // 質問1
        addQARow(); // 質問2
      }

      function clearAll() {
        document.getElementById("id_lead").value = "";
        document.getElementById("id_date").value = "";
        document.getElementById("id_member_count").value = "3";
        
        var defaultRadio = document.querySelector('input[name="interview_style"][value="対面"]');
        if (defaultRadio) defaultRadio.checked = true;

        setupDefaultItems();
        build();
      }

      async function copyOut(){
        var t = document.getElementById("out");
        var statusEl = document.getElementById("status");
        if(!t || !t.value){ if(statusEl) statusEl.textContent = "出力が空です"; return; }
        
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(t.value);
            if(statusEl) statusEl.textContent = "コピーしました";
            return;
          } catch(e) {}
        }
        t.focus(); t.select();
        try {
          document.execCommand('copy');
          if(statusEl) statusEl.textContent = "コピーしました";
        } catch (err) {
          if(statusEl) statusEl.textContent = "選択しました（手動コピー）";
        }
      }

      function selectOut(){
        var t = document.getElementById("out");
        var statusEl = document.getElementById("status");
        if(!t || !t.value){ if(statusEl) statusEl.textContent = "出力が空です"; return; }
        t.focus(); t.select();
        if(statusEl) statusEl.textContent = "選択しました";
      }

      function init() {
        var leadEl = document.getElementById("id_lead");
        var dateEl = document.getElementById("id_date");
        var countEl = document.getElementById("id_member_count");

        if (leadEl) leadEl.addEventListener("input", build);
        if (dateEl) dateEl.addEventListener("input", build);
        if (countEl) countEl.addEventListener("change", function() { rebuildMemberInputs(); build(); });

        var styleRadios = document.querySelectorAll('input[name="interview_style"]');
        for (var r = 0; r < styleRadios.length; r++) {
          styleRadios[r].addEventListener("change", build);
        }

        var btnAddQA = document.getElementById("btn_add_qa");
        var btnAddH3 = document.getElementById("btn_add_h3");
        var btnRemoveItem = document.getElementById("btn_remove_item");
        var btnGen = document.getElementById("btn_gen");
        var btnClear = document.getElementById("btn_clear");
        var btnCopy = document.getElementById("btn_copy");
        var btnSelect = document.getElementById("btn_select");

        if (btnAddQA) {
          btnAddQA.addEventListener("click", function() {
            addQARow();
            build();
          });
        }
        if (btnAddH3) {
          btnAddH3.addEventListener("click", function() {
            addH3Row();
            build();
          });
        }
        if (btnRemoveItem) btnRemoveItem.addEventListener("click", removeItemRow);
        if (btnGen) btnGen.addEventListener("click", build);
        if (btnClear) btnClear.addEventListener("click", clearAll);
        if (btnCopy) btnCopy.addEventListener("click", copyOut);
        if (btnSelect) btnSelect.addEventListener("click", selectOut);

        setupDefaultItems();
        build();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</section>
</main>
