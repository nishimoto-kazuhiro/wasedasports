---
layout: default
title: 投手成績表生成ツール
---

<main>
<header class="sp-gen__head">
  <h1>投手成績表タグ生成ツール</h1>
  <p class="sp-gen__desc">投手の成績データを入力すると、選手名鑑に登録された名前と照合して自動でリンク付きテーブルHTMLを生成します。</p>
</header>

<section class="sp-gen" aria-label="投手成績表生成ツール">
  <style>
    .stats-table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 10px;
    }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #fff;
      min-width: 600px;
    }
    .stats-table th, .stats-table td {
      border: 1px solid #ccc;
      padding: 4px;
      text-align: center;
    }
    .stats-table th {
      background: #f4f4f4;
      font-weight: bold;
    }
    .stats-table input {
      width: 100%;
      box-sizing: border-box;
      padding: 4px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 13px;
    }
    .stats-table input.inp-name { min-width: 100px; }
    .stats-table input.inp-num { text-align: center; }
  </style>

  <div class="sp-gen__wrap">
    <div class="sp-gen__body">
      <!-- 左側：入力エリア -->
      <div class="sp-gen__grid">
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="sp-gen__label" style="font-size: 16px; color: #333;">◆ 投手成績入力</div>
          <p class="sp-gen__status" id="save_status" style="font-size: 12px; color: #2e7d32;">自動保存完了</p>
        </div>

        <div class="stats-table-wrap">
          <table class="stats-table">
            <thead>
              <tr>
                <th>名前</th>
                <th>試</th>
                <th>勝</th>
                <th>負</th>
                <th>回</th>
                <th>安</th>
                <th>球</th>
                <th>振</th>
                <th>失</th>
                <th>責</th>
                <th>率</th>
                <th>削除</th>
              </tr>
            </thead>
            <tbody id="stats_tbody">
              <!-- 動的に追加されます -->
            </tbody>
          </table>
        </div>

        <div class="sp-gen__actions" style="margin-top: 10px;">
          <button class="sp-gen__btn sp-gen__btn--ghost" id="btn_add_row" type="button" style="border-color: #0066cc; background-color: #0066cc; color: #fff;">＋ 投手を追加</button>
          <button class="sp-gen__btn sp-gen__btn--ghost" id="btn_clear_all" type="button" style="border-color: #cc0000; color: #cc0000;">クリア</button>
        </div>

      </div>

      <!-- 右側：出力エリア -->
      <div class="sp-gen__out-area">
        <div class="sp-gen__outlabel">
          <div class="sp-gen__label" style="color: #0066cc;">【出力HTMLコード】</div>
          <p class="sp-gen__status" id="status">未生成</p>
        </div>

        <textarea class="sp-gen__textarea" id="out" placeholder="ここに生成されたHTMLコードが出力されます" readonly style="min-height: 220px; font-family: monospace; font-size: 12px;"></textarea>

        <div class="sp-gen__actions">
          <button class="sp-gen__btn" id="btn_copy" type="button">コードをコピー</button>
          <button class="sp-gen__btn sp-gen__btn--ghost" id="btn_select" type="button">全選択</button>
        </div>

        <div class="sp-preview" style="margin-top: 15px;">
          <p class="sp-preview__label" style="color: #2e7d32; font-weight: bold; margin-bottom: 6px;">【簡易プレビュー】</p>
          <div class="sp-preview__box" id="preview" style="background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; overflow-x: auto;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var STORAGE_KEY = "pitcher_stats_tool_data";
      var PLAYER_DIRECTORY_KEY = "player_reference_links_data"; // 選手名鑑のキー名

      function esc(s){
        return String(s ?? "")
          .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
          .replaceAll('"',"&quot;").replaceAll("'","&#39;");
      }

      // 選手名鑑から「名前 -> URL」のマップ辞書を取得する関数
      function getPlayerDirectoryMap() {
        var map = {};
        try {
          var raw = localStorage.getItem(PLAYER_DIRECTORY_KEY);
          if (raw) {
            var list = JSON.parse(raw);
            if (Array.isArray(list)) {
              list.forEach(function(item) {
                var name = (item.name || "").trim();
                var url = (item.url || "").trim();
                if (name && url) {
                  map[name] = url;
                }
              });
            }
          }
        } catch(e) {}
        return map;
      }

      function addRow(data) {
        var tbody = document.getElementById("stats_tbody");
        if (!tbody) return;

        var tr = document.createElement("tr");
        var d = data || {};

        tr.innerHTML = 
          '<td><input class="inp-name" value="' + esc(d.name || "") + '" placeholder="宮城誇南"></td>' +
          '<td><input class="inp-num inp-shi" value="' + esc(d.shi || "") + '"></td>' +
          '<td><input class="inp-num inp-sho" value="' + esc(d.sho || "") + '"></td>' +
          '<td><input class="inp-num inp-fu" value="' + esc(d.fu || "") + '"></td>' +
          '<td><input class="inp-num inp-kai" value="' + esc(d.kai || "") + '"></td>' +
          '<td><input class="inp-num inp-an" value="' + esc(d.an || "") + '"></td>' +
          '<td><input class="inp-num inp-kyu" value="' + esc(d.kyu || "") + '"></td>' +
          '<td><input class="inp-num inp-shin" value="' + esc(d.shin || "") + '"></td>' +
          '<td><input class="inp-num inp-shitsu" value="' + esc(d.shitsu || "") + '"></td>' +
          '<td><input class="inp-num inp-seki" value="' + esc(d.seki || "") + '"></td>' +
          '<td><input class="inp-num inp-ritsu" value="' + esc(d.ritsu || "") + '"></td>' +
          '<td><button type="button" class="btn-del" style="color:#cc0000; border:none; background:none; cursor:pointer;">✕</button></td>';

        tbody.appendChild(tr);

        var inputs = tr.querySelectorAll("input");
        inputs.forEach(function(inp) {
          inp.addEventListener("input", build);
        });

        tr.querySelector(".btn-del").addEventListener("click", function() {
          tr.remove();
          build();
        });
      }

      function build() {
        var rows = document.querySelectorAll("#stats_tbody tr");
        var list = [];
        var directoryMap = getPlayerDirectoryMap(); // 選手名鑑データを取得

        var html = '<div class="table-container">\n';
        html += '<table class="baseball-data-table">\n';
        html += '<tbody>\n';
        html += '<tr>\n';
        html += '<th class="sticky">名前</th>\n';
        html += '<th>試</th>\n';
        html += '<th>勝</th>\n';
        html += '<th>負</th>\n';
        html += '<th>回</th>\n';
        html += '<th>安</th>\n';
        html += '<th>球</th>\n';
        html += '<th>振</th>\n';
        html += '<th>失</th>\n';
        html += '<th>責</th>\n';
        html += '<th>率</th>\n';
        html += '</tr>\n';

        rows.forEach(function(tr) {
          var name = tr.querySelector(".inp-name").value.trim();
          var shi = tr.querySelector(".inp-shi").value.trim();
          var sho = tr.querySelector(".inp-sho").value.trim();
          var fu = tr.querySelector(".inp-fu").value.trim();
          var kai = tr.querySelector(".inp-kai").value.trim();
          var an = tr.querySelector(".inp-an").value.trim();
          var kyu = tr.querySelector(".inp-kyu").value.trim();
          var shin = tr.querySelector(".inp-shin").value.trim();
          var shitsu = tr.querySelector(".inp-shitsu").value.trim();
          var seki = tr.querySelector(".inp-seki").value.trim();
          var ritsu = tr.querySelector(".inp-ritsu").value.trim();

          list.push({ name, shi, sho, fu, kai, an, kyu, shin, shitsu, seki, ritsu });

          if (name) {
            html += '<tr>\n';
            
            // 選手名鑑に一致する名前が存在するかチェック
            var matchedUrl = directoryMap[name];

            if (matchedUrl) {
              var href = matchedUrl.match(/^https?:\/\//) ? matchedUrl : "https://" + matchedUrl;
              html += '<td class="sticky"><a href="' + esc(href) + '">' + esc(name) + '</a></td>\n';
            } else {
              html += '<td class="sticky">' + esc(name) + '</td>\n';
            }

            html += '<td>' + esc(shi) + '</td>\n';
            html += '<td>' + esc(sho) + '</td>\n';
            html += '<td>' + esc(fu) + '</td>\n';
            html += '<td>' + esc(kai) + '</td>\n';
            html += '<td>' + esc(an) + '</td>\n';
            html += '<td>' + esc(kyu) + '</td>\n';
            html += '<td>' + esc(shin) + '</td>\n';
            html += '<td>' + esc(shitsu) + '</td>\n';
            html += '<td>' + esc(seki) + '</td>\n';
            html += '<td>' + esc(ritsu) + '</td>\n';
            html += '</tr>\n';
          }
        });

        html += '</tbody>\n';
        html += '</table>\n';
        html += '</div>';

        document.getElementById("out").value = html;
        document.getElementById("preview").innerHTML = html;
        document.getElementById("status").textContent = html ? "生成OK" : "未生成";

        // localStorageに保存
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
          document.getElementById("save_status").textContent = "自動保存済み (" + new Date().toLocaleTimeString() + ")";
        } catch(e) {}
      }

      function loadData() {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        try {
          var list = JSON.parse(raw);
          if (Array.isArray(list) && list.length > 0) {
            document.getElementById("stats_tbody").innerHTML = "";
            list.forEach(function(d) { addRow(d); });
            return true;
          }
        } catch(e) {}
        return false;
      }

      function clearAll() {
        if (!confirm("入力データをクリアしますか？")) return;
        try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
        document.getElementById("stats_tbody").innerHTML = "";
        addRow();
        build();
      }

      async function copyOut(){
        var t = document.getElementById("out");
        if(!t || !t.value) return;
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(t.value);
            document.getElementById("status").textContent = "コピーしました";
            return;
          } catch(e) {}
        }
        t.focus(); t.select();
        document.execCommand('copy');
        document.getElementById("status").textContent = "コピーしました";
      }

      function init() {
        document.getElementById("btn_add_row").addEventListener("click", function() {
          addRow();
          build();
        });
        document.getElementById("btn_clear_all").addEventListener("click", clearAll);
        document.getElementById("btn_copy").addEventListener("click", copyOut);
        document.getElementById("btn_select").addEventListener("click", function() {
          var t = document.getElementById("out");
          t.focus(); t.select();
        });

        if (!loadData()) {
          // 初期サンプルデータの設定
          addRow({ name: "宮城誇南", shi: "７", sho: "０", fu: "４", kai: "２", an: "２", kyu: "２", shin: "２", shitsu: "１", seki: "２", ritsu: "6.38" });
          addRow({ name: "岡村遼太郎", shi: "３", sho: "１", fu: "０", kai: "１0/3", an: "２", kyu: "１", shin: "０", shitsu: "２", seki: "２", ritsu: "6.00" });
        }
        build();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</section>
</main>
